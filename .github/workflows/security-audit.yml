name: Security audit

on:
  schedule:
    # Weekly: Monday 06:00 UTC
    - cron: '0 6 * * 1'
  pull_request:
  push:
    branches:
      - main
      - security-hardening

jobs:
  security-audit:
    name: Security audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (read-only)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        run: npm test